<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Alfred Tamayo | Full-Stack Developer</title>
    <meta
      name="description"
      content="Alfred Tamayo is a Full-Stack Developer crafting intuitive web applications that drive business success. Explore projects, experience, and technologies."
    />
    <link rel="canonical" href="https://www.codewithalfred.com" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Alfred Tamayo" />
    <meta name="theme-color" content="#0c0a09" />

    <!-- Favicons -->
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= BASE_URL %>apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= BASE_URL %>favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="<%= BASE_URL %>favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alfred Tamayo | Full-Stack Developer" />
    <meta
      property="og:description"
      content="Portfolio of Alfred Tamayo showcasing full-stack projects, experience, and modern web technologies."
    />
    <meta property="og:url" content="https://www.codewithalfred.com" />
    <meta property="og:image" content="https://www.codewithalfred.com/android-chrome-512x512.png" />
    <meta property="og:site_name" content="Code With Alfred" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alfred Tamayo | Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Building intuitive web applications that enhance user experiences and deliver business value."
    />
    <meta name="twitter:image" content="https://www.codewithalfred.com/android-chrome-512x512.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Alfred Tamayo",
        "url": "https://www.codewithalfred.com",
        "jobTitle": "Full-Stack Developer",
        "sameAs": ["https://github.com/tamayoac", "https://www.codewithalfred.com"]
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but Alfred Tamayo's portfolio doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
